<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FarmersHub — Marketplace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="product.css">
  <style>
    /* ── Marketplace additions ── */
    .mp-nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px; background: rgba(255,255,255,0.96);
      backdrop-filter: blur(8px); box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    .mp-nav .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .mp-nav .brand img { height: 38px; }
    .mp-nav .brand h1 { font-family: 'Sora', sans-serif; font-size: 1.2rem; color: #1b5e20; margin: 0; }
    .mp-nav-links { display: flex; align-items: center; gap: 12px; }
    .mp-nav-links a, .mp-nav-links button {
      font-size: 0.875rem; font-weight: 600; text-decoration: none;
      padding: 7px 16px; border-radius: 20px; border: none; cursor: pointer;
      background: transparent; color: #2e7d32; transition: background 0.2s;
    }
    .mp-nav-links a:hover, .mp-nav-links button:hover { background: #e8f5e9; }
    .mp-nav-links .nav-primary {
      background: #2e7d32; color: #fff; padding: 8px 18px;
    }
    .mp-nav-links .nav-primary:hover { background: #1b5e20; }

    .mp-hero { padding: 48px 28px 24px; text-align: center; }
    .mp-hero h2 { font-family: 'Sora', sans-serif; font-size: 2rem; color: #1b5e20; margin: 0 0 8px; }
    .mp-hero p  { color: #555; font-size: 1rem; margin: 0 0 24px; }

    .mp-search-bar {
      display: flex; max-width: 540px; margin: 0 auto 28px;
      border: 2px solid #c8e6c9; border-radius: 28px; overflow: hidden; background: #fff;
    }
    .mp-search-bar span { padding: 0 14px; font-size: 1.2rem; display: flex; align-items: center; color: #66bb6a; }
    .mp-search-bar input {
      flex: 1; padding: 12px 4px; border: none; outline: none; font-size: 0.9rem; background: transparent;
    }

    .mp-filter-bar {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 0 28px 24px;
    }
    .filter-chip {
      padding: 6px 16px; border-radius: 20px; border: 1.5px solid #a5d6a7;
      background: #fff; color: #2e7d32; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .filter-chip:hover, .filter-chip.active {
      background: #2e7d32; color: #fff; border-color: #2e7d32;
    }

    #loadingMsg {
      text-align: center; padding: 60px 20px; color: #888; font-size: 1rem; display: none;
    }
    #emptyMsg {
      text-align: center; padding: 60px 20px; color: #aaa; font-size: 1rem; display: none;
    }

    .mp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px; padding: 0 28px 60px;
    }

    .mp-card {
      background: #fff; border-radius: 16px; overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08); cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .mp-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.13); }

    .mp-card-img {
      width: 100%; height: 180px; object-fit: cover; display: block;
    }
    .mp-card-img--placeholder {
      width: 100%; height: 180px;
      background: linear-gradient(135deg, #c8e6c9, #f1f8e9);
      display: flex; align-items: center; justify-content: center; font-size: 3rem;
    }

    .mp-card-body { padding: 14px 16px 18px; }
    .mp-card-cat {
      display: inline-block; padding: 2px 10px; border-radius: 12px;
      background: #e8f5e9; color: #2e7d32; font-size: 0.72rem; font-weight: 700;
      text-transform: capitalize; margin-bottom: 6px;
    }
    .mp-card-name { font-size: 1rem; font-weight: 700; color: #1b5e20; margin: 0 0 4px; }
    .mp-card-seller { font-size: 0.8rem; color: #888; margin: 0 0 10px; }
    .mp-card-price-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .mp-card-price { font-size: 1.05rem; font-weight: 700; color: #388e3c; }
    .mp-card-original { font-size: 0.82rem; color: #bbb; text-decoration: line-through; }
    .mp-card-badge {
      font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 10px;
      background: #fff3e0; color: #e65100;
    }
    .mp-card-stock { font-size: 0.78rem; color: #777; margin: 0; }

    /* ── Detail modal ── */
    .mp-modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 999;
      background: rgba(0,0,0,0.5); align-items: center; justify-content: center; padding: 20px;
    }
    .mp-modal-box {
      background: #fff; border-radius: 20px; max-width: 520px; width: 100%;
      max-height: 90vh; overflow-y: auto; padding: 28px; position: relative;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    }
    .mp-modal-close {
      position: absolute; top: 14px; right: 16px; background: none; border: none;
      font-size: 1.4rem; cursor: pointer; color: #888; line-height: 1;
    }
    .mp-modal-close:hover { color: #333; }

    .detail-hero-img {
      width: 100%; height: 220px; object-fit: cover; border-radius: 12px; display: block; margin-bottom: 16px;
    }
    .detail-hero-placeholder {
      width: 100%; height: 220px; border-radius: 12px; margin-bottom: 16px;
      background: linear-gradient(135deg, #c8e6c9, #f1f8e9);
      display: flex; align-items: center; justify-content: center; font-size: 4rem;
    }
    .detail-name { font-family: 'Sora', sans-serif; font-size: 1.4rem; color: #1b5e20; margin: 0 0 6px; }
    .detail-desc { color: #555; font-size: 0.9rem; line-height: 1.6; margin: 10px 0 16px; }
    .detail-grid { border-top: 1px solid #f0f0f0; padding-top: 14px; margin-bottom: 16px; }
    .detail-row {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 7px 0; border-bottom: 1px solid #f5f5f5; font-size: 0.88rem;
    }
    .detail-row span { color: #888; }
    .detail-row strong { color: #222; text-align: right; max-width: 60%; }
    .detail-seller { background: #f9fbe7; border-radius: 10px; padding: 12px 16px; }
    .detail-seller h4 { margin: 0 0 6px; color: #558b2f; font-size: 0.9rem; }
    .detail-seller p { margin: 2px 0; font-size: 0.85rem; color: #444; }
  </style>
</head>

<body>

<canvas id="fallingCanvas"></canvas>

<!-- Nav -->
<header class="mp-nav">
  <a href="index.html" class="brand">
    <img src="logo.png" alt="FarmersHub Logo" />
    <h1>FarmersHub</h1>
  </a>
  <nav class="mp-nav-links">
    <a href="index.html">Home</a>
    <a href="profile.html">Profile</a>
    <a href="login/sell_crops.html">Sell Crops</a>
    <a href="login/login.html" class="nav-primary" id="navLoginBtn">Login</a>
    <button class="nav-primary" id="navLogoutBtn" style="display:none;">Logout</button>
  </nav>
</header>

<!-- Hero -->
<section class="mp-hero">
  <h2>🛒 Fresh Produce Marketplace</h2>
  <p>Browse listings from local farmers — updated live from the database.</p>
  <div class="mp-search-bar">
    <span>⌕</span>
    <input type="text" id="searchInput" placeholder="Search products, farmers, categories..." />
  </div>
</section>

<!-- Category filter -->
<div class="mp-filter-bar" id="categoryFilterBar"></div>

<!-- Status messages -->
<p id="loadingMsg">⏳ Loading products...</p>
<p id="emptyMsg">No products found. Try a different search or filter.</p>

<!-- Product grid -->
<div class="mp-grid" id="productsGrid"></div>

<!-- Product detail modal -->
<div class="mp-modal-overlay" id="detailModal">
  <div class="mp-modal-box">
    <button class="mp-modal-close" id="closeDetailBtn" title="Close">✕</button>
    <div id="detailBody"></div>
  </div>
</div>

<script type="module" src="assets/js/product.js"></script>
</body>

<script>
(function () {
  const canvas = document.getElementById('fallingCanvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // SVG shapes as small inline images
  const svgLeaf = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'>
    <path d='M20 38 C8 30,2 18,4 6 C14 13,22 18,20 38Z' fill='rgba(56,142,60,0.75)'/>
    <line x1='20' y1='38' x2='11' y2='14' stroke='rgba(27,94,32,0.8)' stroke-width='1'/>
  </svg>`;

  const svgLeaf2 = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'>
    <path d='M20 38 C32 30,38 18,36 6 C26 13,18 18,20 38Z' fill='rgba(104,159,56,0.75)'/>
    <line x1='20' y1='38' x2='29' y2='14' stroke='rgba(51,105,30,0.8)' stroke-width='1'/>
  </svg>`;

  const svgWheat = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 50'>
    <line x1='10' y1='50' x2='10' y2='5' stroke='rgba(139,195,74,0.9)' stroke-width='1.5'/>
    <ellipse cx='10' cy='5' rx='4' ry='8' fill='rgba(174,213,129,0.85)'/>
    <ellipse cx='5' cy='18' rx='3' ry='6' fill='rgba(174,213,129,0.75)' transform='rotate(-30 5 18)'/>
    <ellipse cx='15' cy='18' rx='3' ry='6' fill='rgba(174,213,129,0.75)' transform='rotate(30 15 18)'/>
  </svg>`;

  const svgFlower = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'>
    <circle cx='15' cy='15' r='4' fill='rgba(255,193,7,0.9)'/>
    <ellipse cx='15' cy='6' rx='3' ry='5' fill='rgba(255,235,59,0.8)'/>
    <ellipse cx='15' cy='24' rx='3' ry='5' fill='rgba(255,235,59,0.8)'/>
    <ellipse cx='6' cy='15' rx='5' ry='3' fill='rgba(255,235,59,0.8)'/>
    <ellipse cx='24' cy='15' rx='5' ry='3' fill='rgba(255,235,59,0.8)'/>
  </svg>`;

  function makeImg(svg) {
    const blob = new Blob([svg], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.src = url;
    return img;
  }

  const imgs = [
    makeImg(svgLeaf),
    makeImg(svgLeaf2),
    makeImg(svgWheat),
    makeImg(svgFlower)
  ];

  const particles = [];

  function spawn() {
    const size = 18 + Math.random() * 22;
    particles.push({
      x: Math.random() * window.innerWidth,
      y: -size,
      size,
      speed: 1.2 + Math.random() * 2.5,
      drift: (Math.random() - 0.5) * 1.2,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.06,
      img: imgs[Math.floor(Math.random() * imgs.length)],
      opacity: 0.55 + Math.random() * 0.4
    });
  }

  // Pre-populate
  for (let i = 0; i < 18; i++) {
    spawn();
    particles[particles.length - 1].y = Math.random() * window.innerHeight;
  }

  let lastSpawn = 0;

  function animate(ts) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (ts - lastSpawn > 600) {
      spawn();
      lastSpawn = ts;
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.y += p.speed;
      p.x += p.drift;
      p.rot += p.rotSpeed;

      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(p.x + p.size / 2, p.y + p.size / 2);
      ctx.rotate(p.rot);
      ctx.drawImage(p.img, -p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();

      if (p.y > canvas.height + 40) {
        particles.splice(i, 1);
      }
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
