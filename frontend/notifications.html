 <!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notifications - FarmersHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/notification.css">
</head>
<body>
<canvas id="fallingCanvas"></canvas>

<header class="top-nav">
  <a href="index.html" class="brand">
    <img src="assets/images/logorefined.png" alt="FarmersHub Logo" class="home-logo">
    <div>
      <p class="brand-overline">Green Marketplace</p>
      <h1>FarmersHub</h1>
    </div>
  </a>

  <form class="global-search" action="#" method="get">
    <span class="search-icon">⌕</span>
    <input type="text" placeholder="Search farmers, crops, and updates">
  </form>

  <nav class="user-nav">
    <a href="index.html" class="nav-chip">Home</a>
    <a href="profile.html" class="nav-chip">Profile</a>
    <a href="messages.html" class="nav-chip">Messages</a>
    <a href="login/login.html" class="login-btn" id="navLoginBtn">Login</a>
    <button class="login-btn" id="navLogoutBtn" style="display:none;">Logout</button>
  </nav>
</header>

<main class="notifications-shell">
  <section class="notifications-heading">
    <div>
      <p class="eyebrow">Alerts Center</p>
      <h2>Notifications</h2>
    </div>
    <div class="notification-actions">
      <button type="button" class="notification-btn" id="refreshNotificationsBtn">Refresh</button>
      <button type="button" class="notification-btn primary" id="markAllReadBtn">Mark all read</button>
    </div>
  </section>

  <section class="notification-summary" aria-label="Notification summary">
    <article>
      <span id="unreadCount">0</span>
      <p>Unread</p>
    </article>
    <article>
      <span id="orderCount">0</span>
      <p>Orders</p>
    </article>
    <article>
      <span id="messageCount">0</span>
      <p>Messages</p>
    </article>
  </section>

  <section class="notification-toolbar">
    <div class="notification-tabs" aria-label="Notification filters">
      <button type="button" class="tab-btn active" data-filter="all">All</button>
      <button type="button" class="tab-btn" data-filter="order">Orders</button>
      <button type="button" class="tab-btn" data-filter="message">Messages</button>
      <button type="button" class="tab-btn" data-filter="market">Marketplace</button>
      <button type="button" class="tab-btn" data-filter="friend_request">Friends</button>
    </div>
    <label class="notification-search">
      <span>Search</span>
      <input type="search" id="notificationSearch" placeholder="Search alerts">
    </label>
  </section>

  <p class="notification-status" id="notificationStatus"></p>
  <section class="notification-list" id="notificationList" aria-live="polite"></section>
</main>

<div class="reply-modal hidden" id="replyModal" aria-hidden="true">
  <div class="reply-box" role="dialog" aria-modal="true" aria-labelledby="replyModalTitle">
    <button type="button" class="modal-close" id="closeReplyModal" aria-label="Close reply dialog">×</button>
    <h3 id="replyModalTitle">Reply to notification</h3>
    <p class="reply-context" id="replyContext">Send a response directly from the alert.</p>
    <textarea id="replyInput" placeholder="Write a quick reply..."></textarea>
    <div class="reply-actions">
      <button type="button" class="cancel-btn" id="cancelReplyBtn">Cancel</button>
      <button type="button" class="send-btn" id="sendReplyBtn">Send Reply</button>
    </div>
  </div>
</div>

<script type="module" src="notifications.js"></script>
</body>
</html>
