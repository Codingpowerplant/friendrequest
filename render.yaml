services:
  - type: web
    name: farmershub-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false

  - type: web
    name: farmershub-frontend
    runtime: static
    buildCommand: echo "No build step required"
    staticPublishPath: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
